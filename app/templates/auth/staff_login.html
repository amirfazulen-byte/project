{% extends "base.html" %}
{% block title %}Вход для воспитателей{% endblock %}
{% block content %}
<h1>Вход для воспитателей</h1>
<form method="post" class="card">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Логин <input name="login" value="{{ request.form.login }}" required autocapitalize="none"></label>
  <label>Пароль <input name="password" type="password" required></label>
  <button class="btn">Войти</button>
</form>
{% endblock %}
